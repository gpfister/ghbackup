[project]
name = "ghbackup"
version = "0.1.0"
description = "CLI tool to backup an entire GitHub organization with full (.zip) and partial (.patch) backup modes"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Greg PFISTER" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
ghbackup = "src.main:app"
"src.main:app" = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["lost+found", ".venv", ".*"]

